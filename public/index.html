<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>NEXA QUEST</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div id="app" class="flex flex-col min-h-screen">
    <nav class="bg-zinc-900 border-b border-zinc-800 px-4 py-3">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <h1 class="text-xl font-bold">NEXA QUEST</h1>
        <div class="flex gap-4">
          <button onclick="app.navigate('/')" class="px-3 py-2 rounded hover:bg-zinc-800">Dashboard</button>
          <button onclick="app.navigate('/explore')" class="px-3 py-2 rounded hover:bg-zinc-800">Explore</button>
          <button onclick="app.navigate('/check-in')" class="px-3 py-2 rounded hover:bg-zinc-800">Check-in</button>
          <button onclick="app.navigate('/leaderboard')" class="px-3 py-2 rounded hover:bg-zinc-800">Leaderboard</button>
          <button onclick="app.navigate('/settings')" class="px-3 py-2 rounded hover:bg-zinc-800">Settings</button>
        </div>
      </div>
    </nav>

    <div id="toast" class="hidden fixed top-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg z-50"></div>

    <div id="content" class="flex-1 max-w-6xl w-full mx-auto py-8 px-4"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};

    const i18n = {
      id: {
        dashboard: 'Dashboard',
        level: 'Level',
        xp: 'Pengalaman',
        streak: 'Rekor',
        days: 'Hari',
        explore: 'Jelajah Quest',
        mulaiQuest: 'Mulai Quest',
        verifyTask: 'Verifikasi Tugas',
        locked: 'Dikunci',
        comingSoon: 'Coming in a future update',
        checkIn: 'Check-in',
        checkInToday: 'Check-in Hari Ini',
        calendar: 'Kalender 30 Hari',
        leaderboard: 'Peringkat',
        rank: 'Peringkat',
        settings: 'Pengaturan',
        language: 'Bahasa',
        indonesian: 'Bahasa Indonesia',
        english: 'English',
        xpEarned: 'XP earned'
      },
      en: {
        dashboard: 'Dashboard',
        level: 'Level',
        xp: 'Experience',
        streak: 'Streak',
        days: 'Days',
        explore: 'Explore Quests',
        mulaiQuest: 'Start Quest',
        verifyTask: 'Verify Task',
        locked: 'Locked',
        comingSoon: 'Coming in a future update',
        checkIn: 'Check-in',
        checkInToday: 'Check-in Today',
        calendar: '30-Day Calendar',
        leaderboard: 'Leaderboard',
        rank: 'Rank',
        settings: 'Settings',
        language: 'Language',
        indonesian: 'Bahasa Indonesia',
        english: 'English',
        xpEarned: 'XP earned'
      }
    };

    const app = {
      lang: localStorage.getItem('lang') || 'id',
      user: null,

      t(key) {
        return i18n[this.lang][key] || key;
      },

      setLang(lang) {
        this.lang = lang;
        localStorage.setItem('lang', lang);
        this.render();
      },

      async fetchAPI(path, options = {}) {
        const res = await fetch(path, { ...options, headers: { ...headers, ...options.headers } });
        if (!res.ok) throw new Error(res.statusText);
        return res.json();
      },

      async loadUser() {
        try {
          const data = await this.fetchAPI('/api/user');
          this.user = data.user;
          if (!this.user) {
            this.user = { user_id: parseInt(token?.split('.')[0] || '1'), username: 'User', level: 1, xp: 0, streak: 0 };
          }
        } catch (e) {
          console.error('Failed to load user:', e);
          this.user = { user_id: 1, username: 'User', level: 1, xp: 0, streak: 0 };
        }
      },

      async render() {
        await this.loadUser();
        const path = window.location.pathname;
        let content = '';

        if (path === '/' || path === '') {
          content = this.renderDashboard();
        } else if (path === '/explore') {
          content = this.renderExplore();
        } else if (path === '/check-in') {
          content = this.renderCheckIn();
        } else if (path === '/leaderboard') {
          content = this.renderLeaderboard();
        } else if (path === '/settings') {
          content = this.renderSettings();
        }

        document.getElementById('content').innerHTML = content;
      },

      renderDashboard() {
        const maxXp = 1000;
        const xpPercent = Math.min((this.user.xp / maxXp) * 100, 100);
        return `
          <div class="space-y-6">
            <h2 class="text-3xl font-bold">${this.t('dashboard')}</h2>
            <div class="grid gap-4 md:grid-cols-3">
              <div class="bg-zinc-800 rounded-lg p-6">
                <div class="text-sm text-zinc-400">${this.t('level')}</div>
                <div class="text-4xl font-bold mt-2">${this.user.level}</div>
              </div>
              <div class="bg-zinc-800 rounded-lg p-6">
                <div class="text-sm text-zinc-400">${this.t('xp')}</div>
                <div class="xp-progress mt-2">
                  <div class="text-2xl font-bold mb-2">${this.user.xp}</div>
                  <div class="bg-zinc-700 rounded h-2 overflow-hidden">
                    <div class="bg-violet-600 h-full transition-all" style="width: ${xpPercent}%"></div>
                  </div>
                </div>
              </div>
              <div class="bg-zinc-800 rounded-lg p-6">
                <div class="text-sm text-zinc-400">${this.t('streak')}</div>
                <div class="text-4xl font-bold mt-2">${this.user.streak} ${this.t('days')}</div>
              </div>
            </div>
          </div>
        `;
      },

      async renderExplore() {
        try {
          const data = await this.fetchAPI('/api/quests');
          const quests = data.quests || [];
          return `
            <div class="space-y-6">
              <h2 class="text-3xl font-bold">${this.t('explore')}</h2>
              <div class="grid gap-4">
                ${quests.map((q, idx) => this.renderQuestCard(q, idx)).join('')}
              </div>
            </div>
          `;
        } catch (e) {
          console.error('Failed to load quests:', e);
          return `<div class="text-red-400">Error loading quests</div>`;
        }
      },

      renderQuestCard(quest, idx) {
        const isLocked = quest.is_locked;
        const isCompleted = quest.completed;
        const isStarted = quest.started;

        if (isLocked) {
          return `
            <div class="quest-card bg-zinc-800 rounded-lg p-6 opacity-60">
              <div class="flex justify-between items-start mb-4">
                <div>
                  <h3 class="font-bold text-lg">${quest.title}</h3>
                  <p class="text-sm text-zinc-400 mt-2">${quest.description}</p>
                </div>
                <div class="bg-amber-600 text-white px-2 py-1 rounded text-xs font-bold">${this.t('locked')}</div>
              </div>
              <button disabled class="w-full bg-zinc-700 text-zinc-500 px-4 py-2 rounded font-medium cursor-not-allowed">
                ${this.t('comingSoon')}
              </button>
            </div>
          `;
        }

        if (isCompleted) {
          return `
            <div class="quest-card bg-zinc-800 rounded-lg p-6">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-bold text-lg">${quest.title}</h3>
                  <p class="text-sm text-zinc-400 mt-2">${quest.description}</p>
                </div>
                <div class="text-green-400 font-bold">Selesai ✓</div>
              </div>
            </div>
          `;
        }

        return `
          <div class="quest-card bg-zinc-800 rounded-lg p-6">
            <div>
              <h3 class="font-bold text-lg">${quest.title}</h3>
              <p class="text-sm text-zinc-400 mt-2">${quest.description}</p>
              <p class="text-sm text-violet-400 mt-2">+${quest.xp_reward} XP</p>
            </div>
            <div class="flex gap-2 mt-4">
              ${isStarted ? `
                <button onclick="app.verifyQuest(${quest.id})" class="flex-1 bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded font-medium">
                  ${this.t('verifyTask')}
                </button>
              ` : `
                <button onclick="app.startQuest(${quest.id})" class="flex-1 bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded font-medium">
                  ${this.t('mulaiQuest')}
                </button>
              `}
            </div>
          </div>
        `;
      },

      async startQuest(questId) {
        try {
          await this.fetchAPI('/api/quest/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ quest_id: questId })
          });
          await this.render();
        } catch (e) {
          console.error('Failed to start quest:', e);
        }
      },

      async verifyQuest(questId) {
        try {
          const result = await this.fetchAPI('/api/quest/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ quest_id: questId })
          });
          this.showToast(`+${result.xp_earned} XP`);
          await this.render();
        } catch (e) {
          console.error('Failed to verify quest:', e);
        }
      },

      async renderCheckIn() {
        try {
          const data = await this.fetchAPI('/api/check-in/history');
          const today = new Date().toISOString().split('T')[0];
          const history = new Set(data.history || []);
          const daysInMonth = 30;
          const days = [];
          for (let i = 0; i < daysInMonth; i++) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.toISOString().split('T')[0];
            days.push({ date: dateStr, checked: history.has(dateStr) || dateStr === today });
          }
          days.reverse();

          const canCheckIn = !history.has(today);

          return `
            <div class="space-y-6">
              <h2 class="text-3xl font-bold">${this.t('checkIn')}</h2>
              <div class="bg-zinc-800 rounded-lg p-6">
                <div class="mb-4">
                  <div class="text-sm text-zinc-400">${this.t('streak')}</div>
                  <div class="text-4xl font-bold mt-2">${this.user.streak}</div>
                </div>
                <button onclick="app.checkInToday()" ${canCheckIn ? '' : 'disabled'} class="w-full ${canCheckIn ? 'bg-violet-600 hover:bg-violet-500' : 'bg-zinc-700 cursor-not-allowed'} text-white px-4 py-2 rounded font-medium">
                  ${this.t('checkInToday')}
                </button>
              </div>
              <div class="bg-zinc-800 rounded-lg p-6">
                <h3 class="font-bold mb-4">${this.t('calendar')}</h3>
                <div class="calendar-grid grid grid-cols-10 gap-1">
                  ${days.map(d => `
                    <div class="aspect-square rounded ${d.checked ? 'bg-indigo-600' : 'bg-zinc-700'} flex items-center justify-center text-xs">
                      ${new Date(d.date).getDate()}
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        } catch (e) {
          console.error('Failed to load check-in:', e);
          return `<div class="text-red-400">Error loading check-in</div>`;
        }
      },

      async checkInToday() {
        try {
          const result = await this.fetchAPI('/api/check-in', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
          });
          if (result.ok) {
            this.showToast('Check-in successful!');
            await this.render();
          }
        } catch (e) {
          console.error('Failed to check in:', e);
        }
      },

      async renderLeaderboard() {
        try {
          const data = await this.fetchAPI('/api/leaderboard');
          const leaderboard = data.leaderboard || [];
          return `
            <div class="space-y-6">
              <h2 class="text-3xl font-bold">${this.t('leaderboard')}</h2>
              <div class="leaderboard-list space-y-2">
                ${leaderboard.map((user, idx) => `
                  <div class="leaderboard-user flex justify-between items-center px-4 py-2 rounded ${idx === 0 ? 'bg-violet-600/20 text-violet-300' : 'bg-zinc-800'}">
                    <div>
                      <span class="font-bold">${idx + 1}. ${user.username}</span>
                    </div>
                    <div class="text-right">
                      <div class="font-mono font-bold">${user.xp} XP</div>
                      <div class="text-xs text-zinc-400">Level ${user.level}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } catch (e) {
          console.error('Failed to load leaderboard:', e);
          return `<div class="text-red-400">Error loading leaderboard</div>`;
        }
      },

      renderSettings() {
        return `
          <div class="space-y-6">
            <h2 class="text-3xl font-bold">${this.t('settings')}</h2>
            <div class="bg-zinc-800 rounded-lg p-6">
              <div class="flex items-center justify-between">
                <div>
                  <div class="font-bold">${this.t('language')}</div>
                  <div class="text-sm text-zinc-400">Current: ${this.lang === 'id' ? this.t('indonesian') : this.t('english')}</div>
                </div>
                <div class="flex gap-2">
                  <button onclick="app.setLang('id')" class="language-toggle px-4 py-2 rounded ${this.lang === 'id' ? 'bg-violet-600' : 'bg-zinc-700'} hover:bg-violet-500">
                    ${this.t('indonesian')}
                  </button>
                  <button onclick="app.setLang('en')" class="language-toggle px-4 py-2 rounded ${this.lang === 'en' ? 'bg-violet-600' : 'bg-zinc-700'} hover:bg-violet-500">
                    ${this.t('english')}
                  </button>
                </div>
              </div>
            </div>
            <div class="bg-zinc-800 rounded-lg p-6">
              <h3 class="font-bold mb-2">Reward Token Placeholder</h3>
              <p class="text-sm text-zinc-400">$TOKEN - This is a placeholder for future reward token integration. Earned tokens will appear here.</p>
            </div>
          </div>
        `;
      },

      showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2000);
      },

      navigate(path) {
        window.history.pushState({}, '', path);
        this.render();
      }
    };

    window.addEventListener('popstate', () => app.render());
    app.render();
  </script>
</body>
</html>

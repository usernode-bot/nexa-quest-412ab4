        var active = state.route === item.key;
        html += '<button data-nav="' + item.key + '" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors ' +
          (active
            ? 'bg-indigo-50 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-300 font-medium'
            : 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/70 hover:text-zinc-900 dark:hover:text-zinc-100') + '">' +
          icon(item.icon, 'w-[18px] h-[18px] shrink-0') + '<span>' + esc(t('nav.' + item.key)) + '</span></button>';
      });
      html += '</div></div>';
    });
    document.getElementById('sidenav').innerHTML = html;
    document.getElementById('side-tagline').textContent = t('tagline');
  }

  function renderBottomNav() {
    var html = '';
    BOTTOM.forEach(function (key) {
      var item = NAV.main.concat(NAV.me, NAV.more).find(function (i) { return i.key === key; });
      var active = state.route === key;
      html += '<button data-nav="' + key + '" class="nav-item flex flex-col items-center justify-center gap-0.5 py-2.5 ' +
        (active ? 'text-indigo-600 dark:text-indigo-400' : 'text-zinc-500 dark:text-zinc-500') + '">' +
        icon(item.icon, 'w-5 h-5') +
        '<span class="text-[10px] font-medium leading-none">' + esc(t('nav.' + key)) + '</span></button>';
    });
    document.getElementById('bottomnav').innerHTML = html;
  }

  function navigate(route, replace) {
    if (VALID_ROUTES.indexOf(route) === -1) route = 'dashboard';
    state.route = route;
    var url = '/' + (route === 'dashboard' ? '' : route) + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '');
    try { history[replace ? 'replaceState' : 'pushState']({}, '', url); } catch (_) {}
    renderAll();
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-nav]');
    if (btn) navigate(btn.getAttribute('data-nav'));
  });
  window.addEventListener('popstate', function () {
    state.route = routeFromPath();
    renderAll();
  });
  function routeFromPath() {
    var seg = location.pathname.replace(/^\/+|\/+$/g, '');
    return VALID_ROUTES.indexOf(seg) !== -1 ? seg : 'dashboard';
  }

  // ------------------------------------------------------------------
  // Shared UI bits
  // ------------------------------------------------------------------
  function skeleton(rows) {
    var h = '<div class="space-y-4 fade-in">';
    for (var i = 0; i < (rows || 3); i++) {
      h += '<div class="animate-pulse rounded-2xl bg-zinc-200/70 dark:bg-zinc-800/70 h-24"></div>';
    }
    return h + '</div>';
  }
  function errorBanner(retryFnName) {
    return '<div class="fade-in rounded-2xl border border-amber-300/50 dark:border-amber-500/30 bg-amber-50 dark:bg-amber-500/10 px-4 py-3 flex items-center justify-between gap-3">' +
      '<span class="text-sm text-amber-800 dark:text-amber-200">' + esc(t('common.error')) + '</span>' +
      '<button onclick="' + retryFnName + '()" class="text-sm font-medium text-amber-900 dark:text-amber-100 underline underline-offset-2">' + esc(t('common.retry')) + '</button></div>';
  }
  function pageHeader(title, subtitle) {
    return '<div class="mb-6"><h1 class="text-xl md:text-2xl font-semibold tracking-tight">' + esc(title) + '</h1>' +
      (subtitle ? '<p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">' + esc(subtitle) + '</p>' : '') + '</div>';
  }
  function card(inner, extra) {
    return '<div class="rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 shadow-sm ' + (extra || '') + '">' + inner + '</div>';
  }

  function fmtDate(iso) {
    try {
      return new Date(iso).toLocaleDateString(state.lang === 'id' ? 'id-ID' : 'en-US', { day: 'numeric', month: 'short' });
    } catch (_) { return ''; }
  }

  // ------------------------------------------------------------------
  // Data
  // ------------------------------------------------------------------
  function loadProfile() {
    return api('/api/profile').then(function (data) {
      state.profile = data;
      // Server is source of truth for language; adopt it unless the user just
      // switched locally and the save is still in flight.
      var serverLang = data.profile.language;
      if ((serverLang === 'id' || serverLang === 'en') && serverLang !== state.lang && !state.langDirty) {
        state.lang = serverLang;
        try { localStorage.setItem('nexaquest_lang', serverLang); } catch (_) {}
        document.documentElement.lang = serverLang;
        renderAll();
      }
      return data;
    });
  }

  function setLanguage(lang) {
    if (lang !== 'id' && lang !== 'en') return;
    state.lang = lang;
    state.langDirty = true;
    try { localStorage.setItem('nexaquest_lang', lang); } catch (_) {}
    document.documentElement.lang = lang;
    renderAll(); // apply instantly, no reload (spec §5 Settings)
    var save = function () {
      return api('/api/profile/language', { method: 'PATCH', body: JSON.stringify({ language: lang }) });
    };
    save().then(function () {
      state.langDirty = false;
      toast(t('settings.saved'));
    }).catch(function () {
      toast(t('settings.save_retry'));
      setTimeout(function () {
        save().then(function () { state.langDirty = false; }).catch(function () {});
      }, 5000);
    });
  }
  window.__setLanguage = setLanguage;
  window.__setTheme = function (theme) { applyTheme(theme); renderAll(); };

  // ------------------------------------------------------------------
  // Pages
  // ------------------------------------------------------------------
  var page = function () { return document.getElementById('page'); };

  // ---- Dashboard ----
  function renderDashboard() {
    page().innerHTML = skeleton(3);
    Promise.all([loadProfile(), api('/api/quests')]).then(function (res) {
      if (state.route !== 'dashboard') return;
      var p = res[0].profile, stats = res[0].stats, activity = res[0].activity;
      var quests = res[1].quests || [];
      var pct = Math.min(100, Math.round(
        ((p.total_xp - p.xp_level_start) / Math.max(1, p.xp_level_next - p.xp_level_start)) * 100));
      var recommended = quests.filter(function (q) { return !q.my_status; }).slice(0, 3);

      var hero = card(
        '<div class="p-5 md:p-6">' +
          '<div class="flex items-start justify-between gap-4 flex-wrap">' +
            '<div>' +
              '<div class="text-sm text-zinc-500 dark:text-zinc-400">' + esc(t('dash.hello')) + ', <span class="font-medium text-zinc-800 dark:text-zinc-200">' + esc(p.username) + '</span></div>' +
              '<div class="mt-1 flex items-baseline gap-2">' +
                '<span class="text-3xl font-semibold tracking-tight">' + esc(t('dash.level')) + ' ' + p.level + '</span>' +
                '<span class="text-sm text-zinc-500 dark:text-zinc-400">' + p.total_xp + ' XP</span>' +
              '</div>' +
            '</div>' +
            '<div class="flex items-center gap-2 px-3 py-2 rounded-xl bg-orange-50 dark:bg-orange-500/10 text-orange-600 dark:text-orange-400">' +
              icon('flame', 'w-5 h-5') +
              '<span class="font-semibold">' + p.current_streak + '</span>' +
              '<span class="text-sm">' + esc(t('dash.days')) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="mt-4">' +
            '<div class="h-2 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden">' +
              '<div class="h-full rounded-full bg-indigo-500 transition-all" style="width:' + pct + '%"></div>' +
            '</div>' +
            '<div class="mt-1.5 text-xs text-zinc-500 dark:text-zinc-400">' +
              esc(t('dash.to_next', { n: Math.max(0, p.xp_level_next - p.total_xp), l: p.level + 1 })) + '</div>' +
          '</div>' +
          '<div class="mt-5 flex items-center gap-3 flex-wrap">' +
            (p.checked_in_today
              ? '<span class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 text-sm font-medium">' + esc(t('dash.checkin_done')) + '</span>'
              : '<button data-nav="checkin" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition-colors">' + esc(t('dash.checkin_cta')) + '</button>') +
            '<div class="text-sm text-zinc-500 dark:text-zinc-400">' + stats.quests_completed + ' ' + esc(t('dash.quests_done').toLowerCase()) + ' · ' + stats.badges + ' badge</div>' +
          '</div>' +
        '</div>'
      );

      var recHtml;
      if (recommended.length === 0 && stats.quests_completed === 0) {
        recHtml = card('<div class="p-8 text-center">' +
          '<div class="mx-auto w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-500 flex items-center justify-center mb-3">' + icon('compass', 'w-6 h-6') + '</div>' +
          '<p class="text-sm text-zinc-500 dark:text-zinc-400 mb-4">' + esc(t('dash.empty')) + '</p>' +
          '<button data-nav="explore" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium">' + esc(t('dash.empty_cta')) + '</button></div>');
      } else {
        recHtml = '<div class="space-y-3">' + recommended.map(function (q) {
          return card('<button data-nav="explore" class="w-full text-left p-4 flex items-center gap-4">' +
            '<div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-500 flex items-center justify-center shrink-0">' + icon('zap', 'w-5 h-5') + '</div>' +
            '<div class="min-w-0 flex-1"><div class="text-sm font-medium truncate">' + esc(q.title) + '</div>' +
            '<div class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">' + (q.campaign_title ? esc(q.campaign_title) + ' · ' : '') + esc(t('explore.participants', { n: q.participants })) + '</div></div>' +
            '<span class="text-sm font-semibold text-indigo-600 dark:text-indigo-400 shrink-0">+' + q.xp_reward + ' XP</span></button>');
        }).join('') + '</div>';
        if (recommended.length === 0) recHtml = '<p class="text-sm text-zinc-500 dark:text-zinc-400">' + esc(t('explore.empty')) + '</p>';
      }

      var actHtml;
      if (!activity || activity.length === 0) {
        actHtml = card('<div class="p-6 text-center text-sm text-zinc-500 dark:text-zinc-400">' + esc(t('dash.empty_activity')) + '</div>');
      } else {
        actHtml = card('<div class="divide-y divide-zinc-100 dark:divide-zinc-800">' + activity.map(function (a) {
          var label = a.reason === 'daily_checkin' ? t('activity.checkin') : t('activity.quest');
          var detail = a.quest_title ? ' — ' + a.quest_title : '';
          return '<div class="px-4 py-3 flex items-center justify-between gap-3">' +
            '<div class="min-w-0"><div class="text-sm truncate">' + esc(label + detail) + '</div>' +
            '<div class="text-xs text-zinc-400 dark:text-zinc-500">' + esc(fmtDate(a.created_at)) + '</div></div>' +
            '<span class="text-sm font-semibold ' + (a.amount >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-500') + ' shrink-0">' + (a.amount >= 0 ? '+' : '') + a.amount + ' XP</span></div>';
        }).join('') + '</div>');
      }

      page().innerHTML = '<div class="fade-in space-y-6">' + hero +
        '<div><div class="flex items-center justify-between mb-3"><h2 class="font-semibold">' + esc(t('dash.recommended')) + '</h2>' +
        '<button data-nav="explore" class="text-sm text-indigo-600 dark:text-indigo-400 font-medium">' + esc(t('dash.view_all')) + '</button></div>' + recHtml + '</div>' +
        '<div><h2 class="font-semibold mb-3">' + esc(t('dash.activity')) + '</h2>' + actHtml + '</div></div>';
    }).catch(function () {
      if (state.route === 'dashboard') page().innerHTML = errorBanner('__retryPage');
    });
  }

  // ---- Explore ----
  var exploreFilter = 'all';
  function questActionButton(q) {
    if (q.my_status === 'verified') {
      return '<span class="inline-flex px-3.5 py-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 text-sm font-medium">' + esc(t('explore.done')) + '</span>';
    }
    if (q.my_status === 'pending') {
      return '<span class="inline-flex px-3.5 py-1.5 rounded-lg bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-300 text-xs font-medium">' + esc(t('explore.pending')) + '</span>';
    }
    if (q.my_status === 'started') {
      return '<button onclick="__verifyQuest(' + q.id + ')" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition-colors">' + esc(t('explore.verify')) + '</button>';
    }
    return '<button onclick="__startQuest(' + q.id + ')" class="px-3.5 py-1.5 rounded-lg border border-indigo-300 dark:border-indigo-500/40 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 text-sm font-medium transition-colors">' + esc(t('explore.start')) + '</button>';
  }

  function renderExplore() {
    page().innerHTML = pageHeader(t('explore.title'), t('explore.subtitle')) + skeleton(4);
    api('/api/quests').then(function (data) {
      if (state.route !== 'explore') return;
      state.quests = data.quests || [];
      drawExplore();
    }).catch(function () {
      if (state.route === 'explore') page().innerHTML = pageHeader(t('explore.title'), t('explore.subtitle')) + errorBanner('__retryPage');
    });
  }

  function drawExplore() {
    var quests = (state.quests || []).filter(function (q) {
      if (exploreFilter === 'offchain') return q.verification_type === 'offchain';
      if (exploreFilter === 'onchain') return q.verification_type === 'onchain';
      return true;
    });
    var chips = [['all', t('explore.all')], ['offchain', t('explore.offchain')], ['onchain', t('explore.onchain')]]
      .map(function (c) {
        var active = exploreFilter === c[0];
        return '<button onclick="__setExploreFilter(\'' + c[0] + '\')" class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors ' +
          (active ? 'bg-indigo-600 text-white' : 'bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-400 hover:border-indigo-300 dark:hover:border-indigo-500/40') + '">' + esc(c[1]) + '</button>';
      }).join('');

    var list;
    if (quests.length === 0) {
      list = card('<div class="p-8 text-center text-sm text-zinc-500 dark:text-zinc-400">' + esc(t('explore.empty')) + '</div>');
    } else {
      list = '<div class="grid gap-3 sm:grid-cols-2">' + quests.map(function (q) {
        var isLocked = q.title && q.title.indexOf('[Dikunci]') === 0;
        var typeBadge = q.verification_type === 'onchain'
          ? '<span class="px-2 py-0.5 rounded-md bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-300 text-[11px] font-medium">on-chain' + (q.chain ? ' · ' + esc(q.chain) : '') + '</span>'
          : '<span class="px-2 py-0.5 rounded-md bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400 text-[11px] font-medium">off-chain</span>';
        var lockBadge = isLocked
          ? '<span class="px-2 py-0.5 rounded-md bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-300 text-[11px] font-medium">' + esc(t('locked.badge')) + '</span>'
          : '';
        var actionBtn = isLocked
          ? '<span class="inline-flex px-3.5 py-1.5 rounded-lg bg-zinc-100 dark:bg-zinc-800 text-zinc-400 dark:text-zinc-500 text-sm font-medium cursor-not-allowed" title="' + esc(t('locked.coming_soon')) + '">' + esc(t('common.soon')) + '</span>'
          : questActionButton(q);
        return card('<div class="quest-card p-4 flex flex-col gap-3 h-full' + (isLocked ? ' opacity-75' : '') + '">' +
          '<div class="flex items-start justify-between gap-2 flex-wrap">' + (lockBadge || typeBadge) +
          '<span class="text-sm font-semibold text-indigo-600 dark:text-indigo-400">+' + q.xp_reward + ' XP</span></div>' +
          '<div class="flex-1"><div class="font-medium text-sm leading-snug">' + esc(q.title) + '</div>' +
          (q.description ? '<p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1 leading-relaxed">' + esc(q.description) + '</p>' : '') +
          (q.campaign_title ? '<div class="text-[11px] text-zinc-400 dark:text-zinc-500 mt-1.5">' + esc(q.campaign_title) + '</div>' : '') + '</div>' +
          '<div class="flex items-center justify-between gap-2 pt-1">' +
          '<span class="text-xs text-zinc-400 dark:text-zinc-500">' + esc(t('explore.participants', { n: q.participants })) +
          (q.est_minutes ? ' · ' + esc(t('explore.min', { n: q.est_minutes })) : '') + '</span>' +
          actionBtn + '</div></div>', 'h-full');
      }).join('') + '</div>';
    }

    page().innerHTML = '<div class="fade-in">' + pageHeader(t('explore.title'), t('explore.subtitle')) +
      '<div class="flex gap-2 mb-5 flex-wrap">' + chips + '</div>' + list + '</div>';
  }

  window.__setExploreFilter = function (f) { exploreFilter = f; drawExplore(); };
  window.__startQuest = function (id) {
    api('/api/quests/' + id + '/start', { method: 'POST' }).then(function (r) {
      var q = (state.quests || []).find(function (x) { return x.id === id; });
      if (q) q.my_status = r.status;
      drawExplore();
    }).catch(function () { toast(t('common.error')); });
  };
  window.__verifyQuest = function (id) {
    api('/api/quests/' + id + '/verify', { method: 'POST' }).then(function (r) {
      var q = (state.quests || []).find(function (x) { return x.id === id; });
      if (q) q.my_status = r.status;
      if (r.status === 'verified') {
        if (q) q.participants++;
        toast(t('explore.verified_toast', { n: r.xp || (q && q.xp_reward) || 0 }));
      } else if (r.status === 'pending') {
        toast(t('explore.pending_toast'));
      }
      drawExplore();
    }).catch(function () { toast(t('common.error')); });
  };

  // ---- Daily Check-in ----
  function renderCheckin() {
    page().innerHTML = pageHeader(t('checkin.title'), t('checkin.subtitle')) + skeleton(2);
    api('/api/checkin').then(function (data) {
      if (state.route !== 'checkin') return;
      drawCheckin(data);
    }).catch(function () {
      if (state.route === 'checkin') page().innerHTML = pageHeader(t('checkin.title'), t('checkin.subtitle')) + errorBanner('__retryPage');
    });
  }

  function drawCheckin(data) {
    // 30-day calendar grid ending today
    var days = new Set(data.days || []);
    var cells = '';
    var today = new Date(data.today + 'T00:00:00');
    for (var i = 29; i >= 0; i--) {
      var d = new Date(today); d.setDate(d.getDate() - i);
      var isoDay = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      var done = days.has(isoDay);
      var isToday = i === 0;
      cells += '<div class="aspect-square rounded-lg flex items-center justify-center text-[10px] font-medium ' +
        (done ? 'bg-indigo-500 text-white' :
          'bg-zinc-100 dark:bg-zinc-800/80 text-zinc-400 dark:text-zinc-600') +
        (isToday ? ' ring-2 ring-indigo-400 dark:ring-indigo-500' : '') + '">' + d.getDate() + '</div>';
    }

    page().innerHTML = '<div class="fade-in">' + pageHeader(t('checkin.title'), t('checkin.subtitle')) +
      '<div class="grid gap-4 md:grid-cols-2">' +
      card('<div class="p-6 flex flex-col items-center text-center gap-4">' +
        '<div class="flex items-center gap-2 text-orange-500">' + icon('flame', 'w-8 h-8') +
        '<span class="text-4xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">' + data.streak + '</span></div>' +
        '<div class="text-sm text-zinc-500 dark:text-zinc-400">' + esc(t('checkin.streak')) + ' · ' +
        esc(t('checkin.longest')) + ': <span class="font-medium text-zinc-700 dark:text-zinc-300">' + data.longest + '</span></div>' +
        (data.checked_in_today
          ? '<div class="w-full py-3 rounded-xl bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 text-sm font-medium">' + esc(t('checkin.done')) + '</div>'
          : '<button id="checkin-btn" onclick="__doCheckin()" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[.98] text-white font-medium transition-all">' + esc(t('checkin.button')) + '</button>') +
        '<p class="text-xs text-zinc-400 dark:text-zinc-500 leading-relaxed">' + esc(t('checkin.note')) + '</p></div>') +
      card('<div class="p-5"><div class="text-sm font-medium mb-3">' + esc(t('checkin.last30')) + '</div>' +
        '<div class="grid grid-cols-10 gap-1.5">' + cells + '</div>' +
        '<div class="mt-4 flex gap-4 text-xs text-zinc-400 dark:text-zinc-500">' +
        '<span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-indigo-500 inline-block"></span>Check-in</span>' +
        '<span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-zinc-200 dark:bg-zinc-800 inline-block"></span>—</span></div></div>') +
      '</div></div>';
  }

  window.__doCheckin = function () {
    var btn = document.getElementById('checkin-btn');
    if (btn) btn.disabled = true;
    api('/api/checkin', { method: 'POST' }).then(function (r) {
      toast(r.milestone ? t('checkin.milestone', { d: r.milestone }) : t('checkin.success', { n: r.xp_earned }));
      renderCheckin();
    }).catch(function (e) {
      if (e.status === 409) { renderCheckin(); return; }
      if (btn) btn.disabled = false;
      toast(t('common.error'));
    });
  };

  // ---- Leaderboard ----
  var lbPeriod = 'weekly';
  function renderLeaderboard() {
    page().innerHTML = pageHeader(t('lb.title'), t('lb.subtitle')) + skeleton(4);
    api('/api/leaderboard?period=' + lbPeriod).then(function (data) {
      if (state.route !== 'leaderboard') return;
      drawLeaderboard(data);
    }).catch(function () {
      if (state.route === 'leaderboard') page().innerHTML = pageHeader(t('lb.title'), t('lb.subtitle')) + errorBanner('__retryPage');
    });
  }

  function drawLeaderboard(data) {
    var tabs = [['weekly', t('lb.weekly')], ['monthly', t('lb.monthly')], ['all', t('lb.alltime')]]
      .map(function (c) {
        var active = lbPeriod === c[0];
        return '<button onclick="__setLbPeriod(\'' + c[0] + '\')" class="flex-1 px-3 py-2 rounded-lg text-sm font-medium transition-colors ' +
          (active ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm' : 'text-zinc-500 dark:text-zinc-400') + '">' + esc(c[1]) + '</button>';
      }).join('');

    var meId = state.profile && state.profile.profile.user_id;
    var rows = data.leaderboard || [];
    var body;
    if (rows.length === 0) {
      body = card('<div class="p-10 text-center">' +
        '<div class="mx-auto w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-500 flex items-center justify-center mb-3">' + icon('trophy', 'w-6 h-6') + '</div>' +
        '<p class="text-sm text-zinc-500 dark:text-zinc-400">' + esc(t('lb.empty')) + '</p></div>');
    } else {
      body = card('<div class="divide-y divide-zinc-100 dark:divide-zinc-800">' + rows.map(function (r) {
        var isMe = r.user_id === meId;
        var rankBadge = r.rank <= 3
          ? '<span class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold ' +
            (r.rank === 1 ? 'bg-amber-100 dark:bg-amber-500/15 text-amber-600 dark:text-amber-400' :
             r.rank === 2 ? 'bg-zinc-200 dark:bg-zinc-700/60 text-zinc-600 dark:text-zinc-300' :
             'bg-orange-100 dark:bg-orange-500/15 text-orange-600 dark:text-orange-400') + '">' + r.rank + '</span>'
          : '<span class="w-8 h-8 flex items-center justify-center text-sm text-zinc-400 dark:text-zinc-500 font-medium">' + r.rank + '</span>';
        return '<div class="px-4 py-3 flex items-center gap-3 ' + (isMe ? 'bg-indigo-50/60 dark:bg-indigo-500/10' : '') + '">' +
          rankBadge +
          '<div class="min-w-0 flex-1"><span class="text-sm font-medium truncate">' + esc(r.username) + '</span>' +
          (isMe ? ' <span class="text-[11px] px-1.5 py-0.5 rounded bg-indigo-100 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 font-medium">' + esc(t('lb.you')) + '</span>' : '') +
          '<div class="text-xs text-zinc-400 dark:text-zinc-500">' + esc(t('dash.level')) + ' ' + r.level + '</div></div>' +
          '<span class="font-mono text-sm font-medium">' + r.xp + '</span></div>';
      }).join('') + '</div>');
    }

    var meRow = '';
    if (data.me) {
      meRow = card('<div class="px-4 py-3 flex items-center justify-between text-sm">' +
        '<span class="text-zinc-500 dark:text-zinc-400">' + esc(t('lb.your_rank')) + '</span>' +
        '<span class="font-semibold">#' + data.me.rank + ' · ' + data.me.xp + ' ' + esc(t('lb.points')) + '</span></div>', 'mt-3 border-indigo-200 dark:border-indigo-500/30');
    } else if (rows.length > 0) {
      meRow = '<p class="mt-3 text-xs text-zinc-400 dark:text-zinc-500 text-center">' + esc(t('lb.unranked')) + '</p>';
    }

    page().innerHTML = '<div class="fade-in">' + pageHeader(t('lb.title'), t('lb.subtitle')) +
      '<div class="flex gap-1 p-1 rounded-xl bg-zinc-200/60 dark:bg-zinc-800/60 mb-5 max-w-md">' + tabs + '</div>' +
      body + meRow + '</div>';
  }
  window.__setLbPeriod = function (p) { lbPeriod = p; renderLeaderboard(); };

  // ---- Settings ----
  function renderSettings() {
    var draw = function () {
      if (state.route !== 'settings') return;
      var p = state.profile && state.profile.profile;
      var isDark = document.documentElement.classList.contains('dark');
      var langBtn = function (code, label) {
        var active = state.lang === code;
        return '<button onclick="__setLanguage(\'' + code + '\')" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ' +
          (active ? 'bg-indigo-600 text-white shadow-sm' : 'text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100') + '">' + label + '</button>';
      };
      var themeBtn = function (theme, label) {
        var active = (theme === 'dark') === isDark;
        return '<button onclick="__setTheme(\'' + theme + '\')" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ' +
          (active ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm' : 'text-zinc-500 dark:text-zinc-400') + '">' + esc(label) + '</button>';
      };
      var pubkey = p && p.usernode_pubkey;
      var shortKey = pubkey ? pubkey.slice(0, 10) + '…' + pubkey.slice(-6) : null;

      var moreLinks = NAV.main.concat(NAV.me, NAV.more).filter(function (i) {
        return ['campaigns', 'rewards', 'wallet', 'badges', 'referral', 'community', 'notifications', 'help'].indexOf(i.key) !== -1;
      }).map(function (i) {
        return '<button data-nav="' + i.key + '" class="flex items-center gap-3 px-4 py-3 text-sm text-zinc-600 dark:text-zinc-400 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 w-full text-left">' +
          icon(i.icon, 'w-[18px] h-[18px] text-zinc-400 dark:text-zinc-500') + esc(t('nav.' + i.key)) + '</button>';
      }).join('');

      page().innerHTML = '<div class="fade-in max-w-2xl">' + pageHeader(t('settings.title')) +
        '<div class="space-y-5">' +

        card('<div class="p-5"><div class="font-medium text-sm mb-1">' + esc(t('settings.language')) + '</div>' +
          '<p class="text-xs text-zinc-500 dark:text-zinc-400 mb-3">' + esc(t('settings.language_note')) + '</p>' +
          '<div id="lang-switcher" class="flex gap-1 p-1 rounded-xl bg-zinc-200/60 dark:bg-zinc-800/60 max-w-sm">' +
          langBtn('id', 'Bahasa Indonesia') + langBtn('en', 'English') + '</div></div>') +

        card('<div class="p-5"><div class="font-medium text-sm mb-3">' + esc(t('settings.theme')) + '</div>' +
          '<div class="flex gap-1 p-1 rounded-xl bg-zinc-200/60 dark:bg-zinc-800/60 max-w-sm">' +
          themeBtn('dark', t('settings.dark')) + themeBtn('light', t('settings.light')) + '</div></div>') +

        card('<div class="p-5"><div class="font-medium text-sm mb-3">' + esc(t('settings.account')) + '</div>' +
          '<div class="space-y-2 text-sm">' +
          '<div class="flex justify-between gap-4"><span class="text-zinc-500 dark:text-zinc-400">Username</span><span class="font-medium">' + esc(p ? p.username : '—') + '</span></div>' +
          '<div class="flex justify-between gap-4"><span class="text-zinc-500 dark:text-zinc-400">' + esc(t('settings.wallet_identity')) + '</span>' +
          '<span class="font-mono text-xs">' + esc(shortKey || t('settings.not_linked')) + '</span></div>' +
          '<div class="flex justify-between gap-4"><span class="text-zinc-500 dark:text-zinc-400">' + esc(t('dash.level')) + '</span><span class="font-medium">' + (p ? p.level : '—') + ' · ' + (p ? p.total_xp : 0) + ' XP</span></div>' +
          '</div></div>') +

        card('<div class="p-5"><div class="font-medium text-sm mb-3">' + esc(t('about.token')) + '</div>' +
          '<p class="text-xs text-zinc-600 dark:text-zinc-300 leading-relaxed">' + t('about.token_note') + '</p></div>') +

        card('<div class="py-1"><div class="px-4 pt-3 pb-1 text-xs font-medium uppercase tracking-wider text-zinc-400 dark:text-zinc-500">' + esc(t('settings.more')) + '</div>' +
          '<div class="divide-y divide-zinc-100 dark:divide-zinc-800">' + moreLinks + '</div></div>') +

        '</div></div>';
    };
    if (state.profile) draw();
    else { page().innerHTML = skeleton(3); loadProfile().then(draw).catch(draw); }
  }

  // ---- Stub pages (follow-up slices) ----
  var STUBS = {
    campaigns: { icon: 'megaphone', cta: false, locked: false },
    rewards: { icon: 'gift', cta: true, locked: false },
    badges: { icon: 'badge', cta: true, locked: false },
    referral: { icon: 'link', cta: false, locked: false },
    wallet: { icon: 'wallet', cta: false, locked: false },
    community: { icon: 'users', cta: false, locked: false },
    notifications: { icon: 'bell', cta: false, locked: false },
    help: { icon: 'help', cta: false, locked: false },
  };
  function renderStub(key) {
    var cfg = STUBS[key];
    var lockBadge = cfg.locked
      ? '<div class="mb-3"><span class="px-3 py-1 rounded-lg bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-300 text-xs font-medium">' + esc(t('locked.badge')) + ' — ' + esc(t('locked.coming_soon')) + '</span></div>'
      : '';
    page().innerHTML = '<div class="fade-in">' + pageHeader(t('nav.' + key)) +
      card('<div class="p-10 md:p-14 text-center">' +
        lockBadge +
        '<div class="mx-auto w-14 h-14 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-500 flex items-center justify-center mb-4">' + icon(cfg.icon, 'w-7 h-7') + '</div>' +
        '<p class="text-sm text-zinc-600 dark:text-zinc-300 mb-1">' + esc(t('stub.' + key)) + '</p>' +
        '<p class="text-xs text-zinc-400 dark:text-zinc-500 mb-5">' + esc(t('common.soon')) + '</p>' +
        (cfg.cta ? '<button data-nav="explore" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium">' + esc(t('common.explore_cta')) + '</button>' : '') +
        '</div>') + '</div>';
  }

  // ------------------------------------------------------------------
  // Router
  // ------------------------------------------------------------------
  var PAGES = {
    dashboard: renderDashboard,
    explore: renderExplore,
    checkin: renderCheckin,
    leaderboard: renderLeaderboard,
    settings: renderSettings,
  };

  function renderAll() {
    renderSidenav();
    renderBottomNav();
    var fn = PAGES[state.route];
    if (fn) fn(); else renderStub(state.route);
  }
  window.__retryPage = renderAll;

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  document.documentElement.lang = state.lang;
  state.route = routeFromPath();
  renderAll();
  // Warm the profile so Settings/leaderboard "you" markers have data, and to
  // adopt the server-stored language preference (source of truth).
  loadProfile().catch(function () {});
})();
</script>
</body>
</html>
